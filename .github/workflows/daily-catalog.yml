name: Daily Sync Movie Catalog

on:
  schedule:
    # 每天北京时间 04:00（UTC 20:00）
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run catalog sync script
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-catalog.mjs

      - name: Commit and push catalog.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/catalog.json
          git diff --staged --quiet || git commit -m "chore: update daily catalog.json"
          git push
